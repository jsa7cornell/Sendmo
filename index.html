<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SendMo — Prepaid Shipping Made Easy</title>
    <meta name="description" content="Prepaid shipping made easy. Create a link, share it, and let senders print a label — you pay." />
    <meta name="theme-color" content="#1681E5" />

    <!-- Roboto Medium, for the Google Sign-In button only. Google's branding
         terms specify Roboto Medium 14px for the button label; nothing else in
         the app uses it, so it is loaded at one weight. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap" />

    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Open Graph -->
    <meta property="og:title" content="SendMo — Prepaid Shipping Made Easy" />
    <meta property="og:description" content="Prepaid shipping made easy. Create a link, share it, and let senders print a label — you pay." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sendmo.co/" />
    <meta property="og:image" content="https://sendmo.co/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SendMo — Prepaid Shipping Made Easy" />
    <meta name="twitter:description" content="Prepaid shipping made easy. Create a link, share it, and let senders print a label — you pay." />
    <meta name="twitter:image" content="https://sendmo.co/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
