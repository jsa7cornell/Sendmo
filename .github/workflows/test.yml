name: Provide Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Without this, a push to an open PR leaves the superseded run burning a runner
# alongside its replacement — two were in flight simultaneously during the #63
# merge, when a run still took ~35 min. main is excluded: every push there
# deploys, and each commit's run is its own record.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Lint, Unit, and E2E Tests
    runs-on: ubuntu-latest
    # Backstop against a hung step, not a performance target. With no explicit
    # ceiling GitHub applies its 6-hour default, and on 2026-08-19 a hung
    # "Install Playwright Browsers" burned all six before being cancelled,
    # leaving main HEAD with no conclusive run at all (run 32216842692).
    #
    # Sized ABOVE the legitimate maximum on purpose: successful runs measured
    # 6m–20m49s over the last 40 (2026-08-19), the longest being 32209871982 on
    # main. A ceiling near that maximum would cancel green runs on a slow
    # runner — an earlier draft of this file set 20 and would have killed that
    # very run. Expect the range to creep upward as specs are added; re-measure
    # before tightening this, and do not size it from a figure quoted in prose.
    timeout-minutes: 45

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run ESLint (blocking since 2026-08-23 — backlog cleared to 0 errors)
      run: npm run lint

    - name: Run Type Check
      run: npx tsc -b

    - name: Run Unit & Component Tests
      run: npm run test:unit

    # Browser binaries are ~150 MB and identical for a given Playwright
    # version, so re-downloading them every run is pure waste. Keyed on the
    # version so a bump invalidates it automatically.
    - name: Resolve Playwright version
      id: pw
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

    - name: Install Playwright Browsers
      # Deliberately NOT `--with-deps`. That flag runs `apt-get update`, and on
      # 2026-08-19 the Azure Ubuntu mirror stopped answering mid-run: apt logged
      # `Ign:` against every noble index, fell back to archive.ubuntu.com, then
      # produced no output for 30 minutes until the job was cancelled. It did
      # this twice — run 32216842692 and its re-run — after an earlier attempt
      # burned GitHub's full 6-hour default. apt is uncacheable (packages are
      # per-runner), so caching alone would not have avoided it.
      #
      # ubuntu-latest already ships the shared libraries Chromium needs. If a
      # future runner image drops one, Chromium fails to launch and the e2e
      # step goes red immediately — a loud, one-line-to-revert failure, which
      # is strictly better than a silent multi-hour stall.
      timeout-minutes: 8
      run: npx playwright install chromium

    # BLOCKING as of 2026-08-18. Fully mocked, deterministic, and green in CI
    # (run 32101768480: 81 total, 75 passed, 0 failed) — a red result here now
    # means a real regression, so it stops the merge. It was suppressed while
    # the suite was failing 28 of 80 on a host mismatch; that is fixed
    # (tests/e2e/supabase-env.ts).
    - name: Run Playwright E2E Tests
      run: npm run test:e2e
      env:
        # Own report dir — the authed step below runs Playwright again, and
        # both defaulting to playwright-report/ meant the second run
        # overwrote this one before upload. The uploaded artifact recorded
        # 1 test while the suite had run 78, so every failure here was
        # unrecoverable.
        PLAYWRIGHT_HTML_REPORT: playwright-report-main
        # These mock keys ensure API flows gracefully fail or bypass
        # actual billing/shipping in CI without crashing
        VITE_SUPABASE_URL: "http://localhost:54321"
        VITE_SUPABASE_ANON_KEY: "mock_anon_key"

    - name: Run Authed E2E (real Supabase — phone-gate authed spec only)
      # The auth harness (tests/e2e/global-setup.ts) logs the dedicated test
      # user in against REAL GoTrue, so this step needs real Supabase values.
      # Scoped via -g "authed" to just the authed spec, so the mocked suite
      # above (which runs against the localhost mock) is untouched.
      #
      # Deliberately NOT blocking, unlike the mocked suite: this step depends on
      # live Supabase, so making it a merge gate couples every merge to a third
      # party's uptime. But `|| true` is gone — that was the half that made a
      # failure render as a clean green `success`, because the shell exited 0 so
      # `continue-on-error` never engaged. With only `continue-on-error`, a
      # failure shows as a visible warning that does not block.
      run: npx playwright test tests/e2e/phone-gate.spec.ts -g "authed" --project=chromium
      continue-on-error: true
      env:
        PLAYWRIGHT_HTML_REPORT: playwright-report-authed
        # Publishable (public) Supabase values — safe to hardcode; the anon key
        # ships in every browser bundle. Real values are required because
        # global-setup authenticates against the live project.
        VITE_SUPABASE_URL: "https://fkxykvzsqdjzhurntgah.supabase.co"
        VITE_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZreHlrdnpzcWRqemh1cm50Z2FoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAwNjk0NDMsImV4cCI6MjA4NTY0NTQ0M30.6iTUkaum2WylRnH5yEbYivuuo0hVfu8O3ZYoeKssBBU"
        # No Stripe key needed: the authed /links/new spec asserts the "Add your
        # card" heading, which renders without Stripe Elements. If the spec is
        # ever extended to drive the card form, add a real pk_test_ key as
        # VITE_STRIPE_PUBLISHABLE_KEY_TEST (the name stripeClient.ts reads).
        E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
        E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}

    - name: Upload Playwright Report (main suite)
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: playwright-report-main
        path: playwright-report-main/
        retention-days: 30

    - name: Upload Playwright Report (authed)
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: playwright-report-authed
        path: playwright-report-authed/
        retention-days: 30
